baseurl = "https://stemsfun.com/"
theme = "whiteplain"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

# Copyright notice. This is displayer in the footer.
copyright = "&copy; Copyright 2025 James Zhao"

# Language configurations
[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    title = "STEM 趣学"
    weight = 1
    [languages.zh.params]
      disqusShortname = "stem-is-fun"

  [languages.en]
    languageCode = "en"
    languageName = "English"
    title = "STEM is Fun"
    weight = 2
    # Disqus shortname
    [languages.en.params]
      disqusShortname = "stem-is-fun"

[params]
  # whether to use CDN or local file for fontawesome
  useCDN = false
  # whether to include external sharing scripts and icons for twitter, facebook and co.
  showShareIcons = false
  # Date format
  dateFormat = "January 2, 2006"

# This is displayer in About page.
[params.author]
  name = "James Zhao"
  # Gravatar or Abatar image
  gravatar = "honghua.zhao@gmail.com"
  #avatar = "/path/to/avatar"
  linkedin = "honghuazhao"
  email = "honghua.zhao@gmail.com"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# English Menu
[[languages.en.menu.main]]
  name = "Categories"
  identifier = "categories"
  url = "/en/categories/"
  weight = 1
